name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pages artifact (frontend + Worker API base)
        run: |
          mkdir -p dist
          cp public/index.html public/app.js public/style.css dist/
          # All /api/* calls go to the live Cloudflare Worker (D1 + AI live there)
          sed -i 's|<link rel="stylesheet" href="/style.css">|<base href="./"><meta name="api-base" content="https://ielts-20-day-accelerator.lupindsama.workers.dev"><link rel="stylesheet" href="./style.css">|' dist/index.html
          sed -i 's|src="/app.js"|src="./app.js"|' dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
